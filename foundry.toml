[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc = "0.8.24"
evm_version = "paris"
optimizer = true
optimizer_runs = 200
via_ir = true
remappings = ["solmate/=lib/solmate/src/", "forge-std/=lib/forge-std/src/"]

[profile.default.fuzz]
runs = 1000

[profile.default.invariant]
runs = 512
depth = 100
fail_on_revert = true

[profile.ci.fuzz]
runs = 5000

[profile.ci.invariant]
runs = 1000
depth = 200
fail_on_revert = true

[fmt]
line_length = 100
tab_width = 4
bracket_spacing = true
int_types = "preserve"
